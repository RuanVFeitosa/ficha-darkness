services:
  - type: web
    name: ficha-darkness
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm run backend
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_TABLE
        value: personagens
